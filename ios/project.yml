name: Moodlog
options:
  bundleIdPrefix: io.github.akiig
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.6.0"
    CURRENT_PROJECT_VERSION: "38"
targets:
  Moodlog:
    type: application
    platform: iOS
    sources:
      - path: Moodlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akiig.moodlog
        PRODUCT_NAME: Moodlog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Moodlog/Moodlog.entitlements
        ENABLE_PREVIEWS: NO
    info:
      path: Moodlog/Info.plist
      properties:
        CFBundleDisplayName: Sottovoce
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Sottovoce shows your sleep and the medications you log in Health next to your mood, and can send them, with your steps and resting heart rate, to Sottovoce on your PC.
        NSLocalNetworkUsageDescription: Sottovoce syncs your moods with Sottovoce on your PC over your home Wi-Fi.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.akiig.moodlog
            CFBundleURLSchemes: [sottovoce]
        LSApplicationQueriesSchemes: [dose]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Moodlog/Moodlog.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
schemes:
  Moodlog:
    build:
      targets:
        Moodlog: all
