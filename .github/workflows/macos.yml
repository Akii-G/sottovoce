name: Mac app

on:
  push:
    paths: ["src/moodlog", "po/**", "data/app.moodlog.Moodlog.svg", "packaging/macos/**", "test/**", ".github/workflows/macos.yml"]
  release:
    types: [published]   # every release gets the Mac app attached
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple silicon (M1 and newer)
            arch: AppleSilicon
          - runner: macos-15-intel    # Intel Macs
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: GTK 4, libadwaita and Python from Homebrew
        run: |
          brew install gtk4 libadwaita adwaita-icon-theme pygobject3 py3cairo librsvg poppler
          # the Python that Homebrew's PyGObject belongs to
          for py in $(ls $(brew --prefix)/bin/python3.* 2>/dev/null | grep -E 'python3\.[0-9]+$' | sort -Vr) $(brew --prefix)/bin/python3; do
            if "$py" -c "import gi, cairo" 2>/dev/null; then PY="$py"; break; fi
          done
          echo "Using $PY"; "$PY" --version
          "$PY" -m pip install --break-system-packages --quiet pyinstaller cryptography openpyxl
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Tests (the same app logic, on a Mac)
        env:
          GSK_RENDERER: cairo
        run: |
          set -e
          for t in test/test_surveys.py test/test_feelings.py test/test_private.py test/test_medications.py test/test_fixups.py test/test_encrypted_sync.py test/test_merge.py test/test_mac.py; do
            echo "== $t"; "$PY" "$t"
          done

      - name: The app icon
        run: |
          mkdir -p build/Sottovoce.iconset
          for s in 16 32 128 256 512; do
            rsvg-convert -w $s -h $s data/app.moodlog.Moodlog.svg -o build/Sottovoce.iconset/icon_${s}x${s}.png
            rsvg-convert -w $((s * 2)) -h $((s * 2)) data/app.moodlog.Moodlog.svg -o build/Sottovoce.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns build/Sottovoce.iconset -o build/Sottovoce.icns

      - name: Bundle with PyInstaller
        run: |
          set -e
          cp src/moodlog build/moodlog.py
          "$PY" -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/macos/moodlog.spec
          # an ad-hoc signature: Apple silicon runs nothing unsigned (it isn't a paid Apple signature)
          codesign --force --deep --sign - dist/Sottovoce.app
          codesign --verify --deep dist/Sottovoce.app
          du -sh dist/Sottovoce.app

      - name: Check the bundled app (a report as PDF, then the window)
        run: |
          set -e
          APP=dist/Sottovoce.app/Contents/MacOS/Sottovoce
          export MOODLOG_DATA_DIR=$RUNNER_TEMP/data MOODLOG_CONFIG_DIR=$RUNNER_TEMP/config MOODLOG_NO_WHATS_NEW=1
          mkdir -p "$MOODLOG_DATA_DIR" "$MOODLOG_CONFIG_DIR" screenshots
          "$APP" --version
          "$APP" --report "$RUNNER_TEMP/report.pdf"
          test -s "$RUNNER_TEMP/report.pdf" && pdftotext "$RUNNER_TEMP/report.pdf" - | head -5
          failed=0
          for run in tahoe:app default:app; do
            look=${run%%:*}; renderer=${run##*:}
            if [ "$renderer" = cairo ]; then export GSK_RENDERER=cairo; else unset GSK_RENDERER; fi
            echo "{\"style\": \"$look\", \"tour_done\": true, \"customize_seen\": true}" > "$MOODLOG_CONFIG_DIR/config.json"
            MOODLOG_LANG=it "$APP" > "$RUNNER_TEMP/out-$look.txt" 2>&1 &
            pid=$!
            sleep 15
            screencapture -x "screenshots/mac-$look-$renderer.png" || true
            echo "== log $run"; cat "$RUNNER_TEMP/out-$look.txt"
            if kill -0 $pid 2>/dev/null; then echo "$look: running"; kill $pid; else echo "$look: closed by itself"; cat "$RUNNER_TEMP/out-$look.txt"; failed=1; fi
            sleep 2
          done
          exit $failed

      - name: Make the disk image
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/moodlog)
          mkdir -p build/dmg
          cp -R dist/Sottovoce.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Sottovoce" -srcfolder build/dmg -ov -format UDZO "Sottovoce-Mac-$VERSION-${{ matrix.arch }}.dmg"
          ls -la Sottovoce-Mac-*.dmg
          echo "DMG=Sottovoce-Mac-$VERSION-${{ matrix.arch }}.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Sottovoce-Mac-${{ matrix.arch }}-dmg
          path: Sottovoce-Mac-*.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots-${{ matrix.arch }}
          path: screenshots/

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$DMG" --clobber --repo "${{ github.repository }}"
